[project]
name = "agentx-voice-sidecar"
version = "0.1.0"
description = "Local voice sidecar for Agent-X STT/TTS/VAD"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
voice = [
  "faster-whisper",
  "huggingface-hub[hf_xet]>=0.28.0",
  "kokoro-onnx",
  "silero-vad",
  "numpy>=2.1.0",
  "soundfile",
  "torch>=2.0.0",
  "torchaudio>=2.0.0",
  "speechbrain>=0.5.16",
]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentx_voice*"]
